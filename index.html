<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Una biblioteca para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>

  <!-- Sound toggle -->
  <button id="sound-toggle" class="sound-toggle" aria-label="Activar música ambiental" aria-pressed="false">
    <svg viewBox="0 0 24 24" class="icon-sound-on"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path d="M16.5 12a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12z" fill="currentColor"/></svg>
    <svg viewBox="0 0 24 24" class="icon-sound-off" hidden><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><line x1="16" y1="9" x2="21" y2="14" stroke="currentColor" stroke-width="1.6"/><line x1="21" y1="9" x2="16" y2="14" stroke="currentColor" stroke-width="1.6"/></svg>
  </button>

  <!-- LIBRARY SCENE (3D voxel world, built by js/voxel-scene.js) -->
  <main id="library" class="library">
    <div id="scene-container" class="scene-container" aria-label="Biblioteca voxel interactiva. Arrastra para recorrerla."></div>

    <header class="library-header">
      <p class="eyebrow">Biblioteca privada</p>
      <h1 id="lib-title" class="lib-title">Una biblioteca para ti</h1>
      <p id="lib-subtitle" class="lib-subtitle">Cada libro de este estante fue elegido pensando en ti</p>
      <p id="read-counter" class="read-counter"></p>
    </header>

    <div id="pan-hint" class="pan-hint" aria-hidden="true">
      <span class="pan-hint-arrows">&#8596;</span> Arrastra para recorrer la biblioteca
    </div>

    <div id="scene-fallback" class="scene-fallback" hidden>
      Tu navegador no puede mostrar la biblioteca en 3D. Prueba con una versión reciente de Chrome o Safari.
    </div>
  </main>

  <!-- READING STAGE -->
  <section id="stage" class="stage" aria-hidden="true">
    <button id="close-book" class="close-book" aria-label="Cerrar libro">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>

    <div id="book-3d" class="book-3d">
      <div id="book-cover" class="book-cover">
        <div class="cover-face front">
          <p class="cover-title"></p>
          <p class="cover-author"></p>
        </div>
        <div class="cover-face back"></div>
        <div class="cover-spine"></div>
      </div>

      <div id="book-pages" class="book-pages" hidden>
        <button id="prev-page" class="page-nav prev" aria-label="Página anterior">&#10094;</button>
        <div id="flip-mount" class="flip-mount"></div>
        <div id="swipe-hint" class="swipe-hint" aria-hidden="true">
          <span class="swipe-hint-chevrons">&#8250;&#8250;</span>
          Desliza para pasar la página
        </div>
        <button id="next-page" class="page-nav next" aria-label="Página siguiente">&#10095;</button>
        <div class="page-counter"><span id="page-counter-current">1</span> / <span id="page-counter-total">1</span></div>
      </div>
    </div>
  </section>

  <audio id="audio-ambient" src="audio/ambient.wav" loop preload="none"></audio>
  <audio id="audio-pull" src="audio/pull.wav" preload="none"></audio>
  <audio id="audio-open" src="audio/open.wav" preload="none"></audio>
  <audio id="audio-page" src="audio/page.wav" preload="none"></audio>
  <audio id="audio-close" src="audio/close.wav" preload="none"></audio>

  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
